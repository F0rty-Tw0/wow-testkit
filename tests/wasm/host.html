<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Host core checks</title>
    <link rel="stylesheet" href="../../viewer/viewer.css" />
    <link rel="stylesheet" href="../../viewer/panels.css" />
    <link rel="stylesheet" href="../../host/host.css" />
  </head>
  <body>
    <div id="host">
      <span id="host-state"></span>
      <button id="restart" type="button" hidden>Restart</button>
      <button id="repick" type="button" hidden>Re-pick folder</button>
      <button id="reimport" type="button" hidden>Re-import from WTF</button>
      <span id="missing-art" hidden></span>
    </div>
    <div id="banner" hidden></div>
    <div id="toolbar">
      <button id="zoom-out" type="button">&minus;</button>
      <button id="zoom-in" type="button">+</button>
      <button id="zoom-fit" type="button">Fit</button>
      <span id="zoom-label"></span>
    </div>
    <div id="status" hidden></div>
    <div id="skipped" hidden></div>
    <div id="errors" hidden></div>
    <div id="workspace">
      <div id="viewport">
        <div id="background"></div>
        <div id="stage"></div>
        <div id="hover" hidden></div>
        <div id="selection" hidden></div>
      </div>
      <aside id="panels" hidden></aside>
    </div>
    <pre id="out"></pre>
    <script src="hold.js"></script>
    <script src="../../host/worker_bundle.js"></script>
    <script src="../viewer/unit.js"></script>
    <script src="../../viewer/transport.js"></script>
    <script src="../../viewer/viewer_text.js"></script>
    <script src="../../viewer/viewer_font.js"></script>
    <script src="../../viewer/viewer_items.js"></script>
    <script src="../../viewer/viewer.js"></script>
    <script src="../../viewer/keys.js"></script>
    <script src="../../viewer/pointer.js"></script>
    <script src="../../viewer/live.js"></script>
    <script src="../../host/host_fs.js"></script>
    <script src="../../host/host_state.js"></script>
    <script src="../../host/host.js"></script>
    <script src="../../host/host_assets.js"></script>
    <script src="../../host/host_page.js"></script>
    <script src="fakes.js"></script>
    <script src="host_tests.js"></script>
    <script src="host_run_tests.js"></script>
    <script src="host_fault_tests.js"></script>
    <script src="host_page_tests.js"></script>
    <script src="host_repick_tests.js"></script>
  </body>
</html>
