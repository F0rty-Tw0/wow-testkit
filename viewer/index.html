<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Render preview</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <div id="toolbar">
      <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-fit" type="button">Fit</button>
      <span id="zoom-label"></span>
    </div>
    <div id="status" role="alert" hidden></div>
    <div id="errors" hidden></div>
    <div id="workspace">
      <div id="viewport"><div id="stage"></div><div id="hover" hidden></div><div id="selection" hidden></div></div>
      <aside id="panels" hidden></aside>
    </div>
    <script src="transport.js"></script>
    <script src="viewer_text.js"></script>
    <script src="viewer_font.js"></script>
    <script src="viewer_items.js"></script>
    <script src="viewer.js"></script>
    <script src="pointer.js"></script>
    <script src="live.js"></script>
    <script src="inspector.js"></script>
    <script src="console.js"></script>
    <script src="cmdline.js"></script>
    <script src="events.js"></script>
    <script src="state.js"></script>
  </body>
</html>
